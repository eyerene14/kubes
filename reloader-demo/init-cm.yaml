# kubectl create cm webcontent-cm --from-file=welcome.html --from-file=hello.html -o yaml --dry-run=client > init-cm.yaml
apiVersion: v1
data:
  welcome.html: |-
    <!doctype html>
    <html lang="en">
    <!--<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">-->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self';">

    <head>
      <title>Welcome to SEC</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    </head>
    <html>

    <body>
      <main>
        <div class="px-4 py-3 my-2 text-center">
          <h1 class="display-6 fw-bold text-primary">Hello world!</h1>
        </div>
        <form method="get" action="/hello.html">
          <div class="col-md-6 mx-auto text-center">
            <label for="name" class="form-label fw-bold fs-5">Click the button below to see when this page/configMap was last updated!</label>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center my-2">
              <button type="submit" class="btn btn-primary btn-lg px-4 gap-3">Check Update Time</button>
            </div>
          </div>
        </form>
      </main>
    </body>

    </html>
  hello.html: |-
    <!doctype html>
    <html lang="en">
    <!--<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">-->

    <head>
      <title>Welcome to SEC</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    </head>
    <html>

    <body>
      <main>
        <div class="px-4 py-3 my-2 text-center">
          <h1 class="display-6 fw-bold text-primary">Welcome, <span id="userName">Guest</span>!</h1>
        
          <div class="col-md-6 mx-auto text-center">
            <marquee behavior="scroll" loop="-1" width="30%">
                <label for="name" class="form-label fw-bold fs-5">
                    <font color="black">
                      Today's date is: 
                      <strong>
                      <span id="time"></span>
                      </strong>           
                    </font>
                </label>
            </marquee>
          </div>

          <div class="col-md-6 mx-auto text-center">
            <label for="timeCreated" class="form-label fw-bold fs-5" id="timeCreated">Page created: <span id="timeCreatedValue"></span></label>
            <label for="timeUpdated" class="form-label fw-bold fs-5" id="timeUpdated">Page last updated: <span id="timeUpdatedValue"></span></label>
            </div>

          <div class="d-grid gap-2 d-sm-flex justify-content-sm-center my-2">
            <a href="/index.html" class="btn btn-primary btn-lg px-4 gap-3">Back home</a>
          </div>

        </div>
      </main>

          <script>
            //<script src="script.js">
            // script.js

            // Get the query string from the URL
            const queryString = window.location.search;

            // Parse the query string into URLSearchParams object
            const urlParams = new URLSearchParams(queryString);

            // Get parameter values
            const userName = urlParams.get('name');
            const pageTitle = urlParams.get('title');

            // Update HTML elements
            if (userName) {
                document.getElementById("userName").innerHTML = userName;
            }
            if (pageTitle) {
                document.getElementById("pageTitle").innerHTML = pageTitle;
            }
            var today = new Date();
            document.getElementById('time').innerHTML=today;
          </script>
    </body>

    </html>
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: webcontent-cm
  namespace: demo
