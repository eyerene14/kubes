---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: datadog-operator
  namespace: datadog-demo
spec:
  interval: 1m
  chart:
    spec:
      chart: datadog-operator
      version: 2.8.0
      sourceRef:
        kind: HelmRepository
        name: datadog-chart
        namespace: datadog-demo
---
apiVersion: source.toolkit.fluxcd.io/v1beta1
kind: HelmRepository
metadata:
  name: datadog-chart
  namespace: datadog-demo
spec:
  interval: 30m
  url: https://helm.datadoghq.com
  timeout: 2m
