---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: datadog-demo
resources:
  #- namespace.yaml
  #- datadog-operator-helmrelease.yaml
  - datadog-agent.yaml
  #- script.yaml
  #- sa.yaml
  #- datadog-cjob.yaml

commonAnnotations:
  reloader.stakater.com/auto: "true"
patches:
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /metadata/annotations
      value: 
        'reloader.stakater.com/auto': "true"
- target:
    kind: DaemonSet
  patch: |-
    - op: add
      path: /spec/template/metadata/annotations
      value:
        'reloader.stakater.com/auto': "true"
#components:
  #- ./components
