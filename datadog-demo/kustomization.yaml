---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  #- namespace.yaml
  - datadog-operator-helmrelease.yaml
  - datadog-agent.yaml
  - script.yaml
  - sa.yaml
  - datadog-cjob.yaml
patches:
 - target:
     kind: Deployment
   patch: |-
     - op: add
       path: '/spec/template/metadata/annotations'
       value:
         'reloader.stakater.com/auto: "true"'
